<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-card">
            <h1>Guessing Game</h1>
            <p class="subtitle">Guess a number between 1 and 100</p>
            
            <div class="game-content">
                <div class="input-group">
                    <input 
                        type="number" 
                        id="guessInput" 
                        placeholder="Enter your guess" 
                        min="1" 
                        max="100"
                    >
                    <button id="guessBtn" onclick="makeGuess()">Guess</button>
                </div>

                <div id="feedback" class="feedback"></div>
                
                <div class="stats">
                    <div class="stat">
                        <span class="label">Attempts:</span>
                        <span id="attempts" class="value">0</span>
                    </div>
                </div>

                <div id="guessHistory" class="history"></div>

                <button id="resetBtn" onclick="resetGame()" class="reset-btn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
