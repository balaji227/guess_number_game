<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-elements">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="title">🎮 Number Quest</h1>
            <p class="tagline">Think, Guess, Win!</p>
        </div>

        <div class="game-card">
            <!-- Difficulty Selector -->
            <div class="difficulty-section">
                <label for="difficulty">Select Difficulty:</label>
                <div class="difficulty-buttons">
                    <button class="difficulty-btn" data-difficulty="easy" onclick="setDifficulty('easy')">Easy</button>
                    <button class="difficulty-btn" data-difficulty="medium" onclick="setDifficulty('medium')" style="width: auto;">Medium</button>
                    <button class="difficulty-btn" data-difficulty="hard" onclick="setDifficulty('hard')">Hard</button>
                </div>
            </div>

            <p class="subtitle" id="rangeDisplay">Guess a number between 1 and 100</p>
            
            <div class="game-content">
                <!-- Stats Row -->
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-label">Attempts</span>
                        <span id="attempts" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Streak</span>
                        <span id="streak" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Best</span>
                        <span id="bestScore" class="stat-value">-</span>
                    </div>
                </div>

                <!-- Input Group -->
                <div class="input-group">
                    <input 
                        type="number" 
                        id="guessInput" 
                        placeholder="Enter your guess" 
                        min="1" 
                        max="100"
                    >
                    <button id="guessBtn" onclick="makeGuess()" class="btn-guess">Guess</button>
                </div>

                <!-- Feedback Message -->
                <div id="feedback" class="feedback"></div>
                
                <!-- Hint and Progress -->
                <div class="hint-section">
                    <button id="hintBtn" onclick="getHint()" class="btn-secondary">💡 Get Hint</button>
                    <div id="hintsRemaining" class="hints-info"></div>
                </div>

                <!-- Progress Bar -->
                <div class="progress-container" id="progressContainer" style="display:none;">
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                    <p id="progressText" class="progress-text"></p>
                </div>

                <!-- Guess History -->
                <div id="guessHistory" class="history"></div>

                <!-- Buttons -->
                <div class="button-group">
                    <button id="resetBtn" onclick="resetGame()" class="reset-btn">Play Again</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
